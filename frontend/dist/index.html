<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pinnacle Odds Tracker - POD</title>
    <link rel="stylesheet" href="/static/styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div id="app">
        <!-- Header -->
        <header class="header">
            <div class="header-content">
                <div class="logo">
                    <i class="fas fa-chart-line"></i>
                    <span>POD</span>
                    <span class="logo-subtitle">Pinnacle Odds Drop Tracker</span>
                </div>
                <div class="header-stats">
                    <div class="stat-item">
                        <span class="stat-label">Live Events</span>
                        <span class="stat-value" id="live-events">0</span>
                    </div>
                    <div class="stat-item">
                        <span class="stat-label">Changes 24h</span>
                        <span class="stat-value" id="changes-24h">0</span>
                    </div>
                    <div class="stat-item">
                        <span class="stat-label">Flagged</span>
                        <span class="stat-value flagged" id="flagged-count">0</span>
                    </div>
                    <div class="stat-item countdown-timer">
                        <span class="stat-label">Next Scrape</span>
                        <span class="stat-value" id="next-scrape-countdown">--:--</span>
                    </div>
                </div>
                <div class="connection-status">
                    <div class="status-indicator" id="connection-status">
                        <i class="fas fa-circle"></i>
                        <span>Connecting...</span>
                    </div>
                </div>
            </div>
        </header>

        <!-- Navigation Tabs -->
        <nav class="nav-tabs">
            <button class="nav-tab active" data-tab="odds">
                <i class="fas fa-chart-bar"></i>
                Live Odds
            </button>
            <button class="nav-tab" data-tab="drops">
                <i class="fas fa-arrow-down"></i>
                Drops
                <span class="tab-badge" id="drops-badge">0</span>
            </button>
            <button class="nav-tab" data-tab="history">
                <i class="fas fa-history"></i>
                History
            </button>
            <button class="nav-tab" data-tab="settings">
                <i class="fas fa-cog"></i>
                Settings
            </button>
        </nav>

        <!-- Main Content -->
        <main class="main-content">
            <!-- Live Odds Tab -->
            <div class="tab-content active" id="odds-tab">
                <div class="odds-controls">
                    <div class="filter-group">
                        <select id="sport-filter" class="filter-select">
                            <option value="">All Sports</option>
                        </select>
                        <select id="market-filter" class="filter-select">
                            <option value="">All Markets</option>
                        </select>
                        <button class="refresh-btn" id="refresh-odds">
                            <i class="fas fa-sync-alt"></i>
                            Refresh
                        </button>
                    </div>
                    <div class="view-controls">
                        <button class="view-toggle active" data-view="grid">
                            <i class="fas fa-th"></i>
                        </button>
                        <button class="view-toggle" data-view="list">
                            <i class="fas fa-list"></i>
                        </button>
                    </div>
                </div>

                <div class="odds-container" id="odds-container">
                    <!-- Odds will be populated here -->
                </div>
            </div>

            <!-- Drops Tab -->
            <div class="tab-content" id="drops-tab">
                <div class="drops-header">
                    <h2>Significant Odds Drops</h2>
                    <div class="drops-controls">
                        <select id="drops-time-filter" class="filter-select">
                            <option value="1">Last Hour</option>
                            <option value="6">Last 6 Hours</option>
                            <option value="24" selected>Last 24 Hours</option>
                            <option value="168">Last Week</option>
                        </select>
                        <button class="refresh-btn" id="refresh-drops">
                            <i class="fas fa-sync-alt"></i>
                            Refresh
                        </button>
                    </div>
                </div>

                <div class="drops-container" id="drops-container">
                    <!-- Drops will be populated here -->
                </div>
            </div>

            <!-- History Tab -->
            <div class="tab-content" id="history-tab">
                <div class="history-header">
                    <h2>Odds History</h2>
                    <div class="history-controls">
                        <input type="text" id="history-event-search" placeholder="Search events..." class="search-input">
                        <button class="refresh-btn" id="refresh-history">
                            <i class="fas fa-sync-alt"></i>
                            Refresh
                        </button>
                    </div>
                </div>

                <div class="history-container" id="history-container">
                    <!-- History will be populated here -->
                </div>
            </div>

            <!-- Settings Tab -->
            <div class="tab-content" id="settings-tab">
                <div class="settings-container">
                    <h2>Settings</h2>
                    <div class="settings-group">
                        <h3>Change Detection</h3>
                        <div class="setting-item">
                            <label for="change-threshold">Change Threshold (%)</label>
                            <input type="number" id="change-threshold" value="5" min="1" max="50" step="0.1">
                        </div>
                        <div class="setting-item">
                            <label for="auto-refresh">Auto Refresh (seconds)</label>
                            <input type="number" id="auto-refresh" value="30" min="5" max="300" step="5">
                        </div>
                    </div>
                    <div class="settings-group">
                        <h3>Notifications</h3>
                        <div class="setting-item">
                            <label class="checkbox-label">
                                <input type="checkbox" id="notifications-enabled" checked>
                                <span class="checkmark"></span>
                                Enable Notifications
                            </label>
                        </div>
                        <div class="setting-item">
                            <label class="checkbox-label">
                                <input type="checkbox" id="sound-enabled" checked>
                                <span class="checkmark"></span>
                                Enable Sound Alerts
                            </label>
                        </div>
                    </div>
                    <div class="settings-group">
                        <h3>Display</h3>
                        <div class="setting-item">
                            <label for="odds-format">Odds Format</label>
                            <select id="odds-format">
                                <option value="american" selected>American</option>
                                <option value="decimal">Decimal</option>
                                <option value="fractional">Fractional</option>
                            </select>
                        </div>
                        <div class="setting-item">
                            <label for="timezone">Timezone</label>
                            <select id="timezone">
                                <option value="UTC" selected>UTC</option>
                                <option value="EST">Eastern Time</option>
                                <option value="PST">Pacific Time</option>
                                <option value="GMT">Greenwich Mean Time</option>
                            </select>
                        </div>
                    </div>
                    <div class="settings-actions">
                        <button class="save-settings-btn" id="save-settings">
                            <i class="fas fa-save"></i>
                            Save Settings
                        </button>
                        <button class="reset-settings-btn" id="reset-settings">
                            <i class="fas fa-undo"></i>
                            Reset to Defaults
                        </button>
                    </div>
                </div>
            </div>
        </main>

        <!-- Toast Notifications -->
        <div class="toast-container" id="toast-container"></div>

        <!-- Loading Overlay -->
        <div class="loading-overlay" id="loading-overlay">
            <div class="loading-spinner">
                <i class="fas fa-spinner fa-spin"></i>
                <span>Loading...</span>
            </div>
        </div>
    </div>

    <script src="/static/app.js"></script>
</body>
</html>
