<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Not POD</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="stylesheet" href="/static/styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div id="app">
        <!-- Header -->
        <header class="header">
            <div class="header-content">
                <div class="logo">
                    <i class="fas fa-chart-line"></i>
                    <span>Not POD</span>
                    <span class="logo-subtitle">Not Pinnacle Odds Dropper</span>
                </div>
                <div class="header-stats">
                    <div class="stat-item">
                        <span class="stat-label">Live Events</span>
                        <span class="stat-value" id="live-events">0</span>
                    </div>
                    <div class="stat-item">
                        <span class="stat-label">Changes 24h</span>
                        <span class="stat-value" id="changes-24h">0</span>
                    </div>
                    <div class="stat-item">
                        <span class="stat-label">Placed</span>
                        <span class="stat-value" id="placed-count">0</span>
                    </div>
                    <div class="stat-item countdown-timer">
                        <span class="stat-label">Next Scrape</span>
                        <span class="stat-value" id="next-scrape-countdown">--:--</span>
                    </div>
                </div>
                <div class="connection-status">
                    <div class="status-indicator" id="connection-status">
                        <i class="fas fa-circle"></i>
                        <span>Connecting...</span>
                    </div>
                </div>
            </div>
        </header>

        <!-- Navigation Tabs -->
        <nav class="nav-tabs">
            <button class="nav-tab active" data-tab="odds">
                <i class="fas fa-chart-bar"></i>
                Odds
            </button>
            <button class="nav-tab" data-tab="drops">
                <i class="fas fa-arrow-down"></i>
                Drops
                <span class="tab-badge" id="drops-badge">0</span>
            </button>
            <button class="nav-tab" data-tab="bets">
                <i class="fas fa-chart-bar"></i>
                Bets
            </button>
            <button class="nav-tab" data-tab="settings">
                <i class="fas fa-cog"></i>
                Settings
            </button>
        </nav>

        <!-- Main Content -->
        <main class="main-content">
            <!-- Live Odds Tab -->
            <div class="tab-content active" id="odds-tab">
                <div class="odds-controls">
                    <div class="filter-group">
                        <select id="sport-filter" class="filter-select">
                            <option value="">All Sports</option>
                        </select>
                        <select id="market-filter" class="filter-select">
                            <option value="">All Markets</option>
                        </select>
                    </div>
                </div>

                <div class="odds-container" id="odds-container">
                    <!-- Odds will be populated here -->
                </div>
            </div>

            <!-- Drops Tab -->
            <div class="tab-content" id="drops-tab">
                <div class="drops-header">
                    <h2>Significant Odds Drops</h2>
                    <div class="drops-controls">
                        <select id="drops-time-filter" class="filter-select">
                            <option value="1">Last Hour</option>
                            <option value="6">Last 6 Hours</option>
                            <option value="24" selected>Last 24 Hours</option>
                            <option value="168">Last Week</option>
                        </select>
                    </div>
                </div>

                <div class="drops-container" id="drops-container">
                    <!-- Drops will be populated here -->
                </div>
            </div>

            <!-- Bets Tab -->
            <div class="tab-content" id="bets-tab">
                <div class="bets-header">
                    <h2>Logged Bets</h2>
                </div>
                <div class="bets-container" id="bets-container">
                    <!-- Bets will be populated here -->
                </div>
            </div>

            <!-- Settings Tab -->
            <div class="tab-content" id="settings-tab">
                <div class="settings-container">
                    <div class="settings-group">
                        <h3>Change Detection</h3>
                        <div class="setting-item">
                            <label for="change-threshold">Change Threshold (%)</label>
                            <input type="number" id="change-threshold" value="5" min="1" max="50" step="0.1">
                        </div>
                        <div class="setting-item">
                            <label for="auto-refresh">Auto Refresh (seconds)</label>
                            <input type="number" id="auto-refresh" value="30" min="5" max="300" step="5">
                        </div>
                    </div>
                    <div class="settings-group">
                        <h3>Notifications</h3>
                        <div class="setting-item">
                            <label class="checkbox-label">
                                <input type="checkbox" id="notifications-enabled" checked>
                                <span class="checkmark"></span>
                                Enable Notifications
                            </label>
                        </div>
                        <div class="setting-item">
                            <label class="checkbox-label">
                                <input type="checkbox" id="sound-enabled" checked>
                                <span class="checkmark"></span>
                                Enable Sound Alerts
                            </label>
                        </div>
                    </div>
                    <div class="settings-group">
                        <h3>Display</h3>
                        <div class="setting-item">
                            <label for="odds-format">Odds Format</label>
                            <select id="odds-format">
                                <option value="american" selected>American</option>
                                <option value="decimal">Decimal</option>
                                <option value="fractional">Fractional</option>
                            </select>
                        </div>
                        <div class="setting-item">
                            <label for="timezone">Timezone</label>
                            <select id="timezone">
                                <option value="UTC" selected>UTC</option>
                                <option value="EST">Eastern Time</option>
                                <option value="PST">Pacific Time</option>
                                <option value="GMT">Greenwich Mean Time</option>
                            </select>
                        </div>
                    </div>
                    <div class="settings-actions">
                        <button class="save-settings-btn" id="save-settings">
                            <i class="fas fa-save"></i>
                            Save Settings
                        </button>
                        <button class="reset-settings-btn" id="reset-settings">
                            <i class="fas fa-undo"></i>
                            Reset to Defaults
                        </button>
                    </div>
                </div>
            </div>
        </main>

        <!-- Price History Side Pane -->
        <div id="price-history-pane" class="price-history-pane">
            <div class="pane-header">
                <h3 id="pane-title">Price History</h3>
                <div class="pane-actions">
                    <button id="log-bet-btn" class="log-bet-btn" title="Log Bet">
                        <i class="fas fa-plus"></i>
                    </button>
                    <button id="close-pane" class="close-btn">
                        <i class="fas fa-times"></i>
                    </button>
                </div>
            </div>
            <div class="pane-content">
                <div id="price-chart-container" class="chart-container">
                    <canvas id="price-chart"></canvas>
                </div>
                <div id="price-history-table-container" class="table-container">
                    <table id="price-history-table" class="price-history-table">
                        <thead>
                            <tr>
                                <th>Time</th>
                                <th>Price</th>
                                <th>Limit</th>
                            </tr>
                        </thead>
                        <tbody id="price-history-tbody">
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

        <!-- Toast Notifications -->
        <div class="toast-container" id="toast-container"></div>

        <!-- Loading Overlay -->
        <div class="loading-overlay" id="loading-overlay">
            <div class="loading-container">
                <div class="loading-logo">
                    <i class="fas fa-chart-line"></i>
                    <span>Not POD</span>
                </div>
                <div class="loading-animation">
                    <div class="pulse-ring"></div>
                    <div class="pulse-ring delay-1"></div>
                    <div class="pulse-ring delay-2"></div>
                </div>
                <div class="loading-text">
                    <span class="loading-dots">
                        <span>Loading</span>
                        <span class="dot">.</span>
                        <span class="dot">.</span>
                        <span class="dot">.</span>
                    </span>
                </div>
            </div>
        </div>
    </div>

        <!-- Bet Logging Modal -->
        <div id="bet-modal" class="bet-modal">
            <div class="bet-modal-content">
                <div class="bet-modal-header">
                    <h3>Log Bet</h3>
                    <button id="close-bet-modal" class="close-btn">
                        <i class="fas fa-times"></i>
                    </button>
                </div>
                <div class="bet-modal-body">
                    <div class="bet-info">
                        <div class="bet-field">
                            <label>Match:</label>
                            <span id="bet-match">-</span>
                        </div>
                        <div class="bet-field">
                            <label>Bet:</label>
                            <span id="bet-selection">-</span>
                        </div>
                    </div>
                    <div class="bet-inputs">
                        <div class="input-group">
                            <label for="bet-odds">Odds:</label>
                            <input type="number" id="bet-odds" step="0.01">
                        </div>
                        <div class="input-group">
                            <label for="bet-stake">Stake ($):</label>
                            <input type="number" id="bet-stake" step="0.01">
                        </div>
                        <div class="input-group">
                            <label for="bet-ev">EV (%):</label>
                            <input type="number" id="bet-ev" step="0.01" readonly>
                        </div>
                    </div>
                </div>
                <div class="bet-modal-footer">
                    <button id="cancel-bet" class="btn btn-secondary">Cancel</button>
                    <button id="log-bet" class="btn btn-primary">Log Bet</button>
                </div>
            </div>
        </div>

        <!-- Delete Confirmation Modal -->
        <div id="delete-modal" class="bet-modal">
            <div class="bet-modal-content">
                <div class="bet-modal-header">
                    <h3>Delete Bet</h3>
                    <button id="close-delete-modal" class="close-btn">
                        <i class="fas fa-times"></i>
                    </button>
                </div>
                <div class="bet-modal-body">
                    <p>Are you sure?</p>
                </div>
                <div class="bet-modal-footer">
                    <button id="cancel-delete" class="btn btn-secondary">Cancel</button>
                    <button id="confirm-delete" class="btn btn-danger">Delete Bet</button>
                </div>
            </div>
        </div>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="/static/app.js"></script>
</body>
</html>
